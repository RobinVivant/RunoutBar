name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          swift --version
          node --version || true
      - name: Test
        run: swift test
      - name: Build and package the app
        run: scripts/package-release.sh
      - name: Render the demo snapshots
        run: swift run UsageBar --snapshot "$RUNNER_TEMP/snapshots" --demo
      - name: Upload the snapshots
        uses: actions/upload-artifact@v7
        with:
          name: snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: error
