name: Bug report
description: Something shows the wrong value, fails or crashes
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove account names, email addresses and tokens from everything you paste.
        Never attach `~/.config/teamclaude.json` or an unredacted `teamclaude status --json`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Say whether `swift run RunoutBar --demo` shows it too.
      placeholder: |
        1. Open the popover
        2. Click ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Runout Bar commit
      description: The output of `git rev-parse --short HEAD` in your checkout.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "15.5"
    validations:
      required: true
  - type: input
    id: teamclaude
    attributes:
      label: TeamClaude version
      description: Shown in the popover footer, or `teamclaude --version`.
  - type: input
    id: codex
    attributes:
      label: Codex CLI version
      description: Only for a Codex problem. `codex --version`.
  - type: textarea
    id: more
    attributes:
      label: Screenshots or logs
      description: Redacted. A snapshot from `swift run RunoutBar --snapshot /tmp/runout-bar` helps for a layout problem.
