    <clipPath id="bar1"><rect x="114.7" y="141.3" width="49.2" height="237.6" rx="24.6"/></clipPath>
    <clipPath id="bar2"><rect x="192.5" y="141.3" width="49.2" height="237.6" rx="24.6"/></clipPath>
    <clipPath id="bar3"><rect x="270.3" y="141.3" width="49.2" height="237.6" rx="24.6"/></clipPath>
    <clipPath id="bar4"><rect x="348.2" y="141.3" width="49.2" height="237.6" rx="24.6"/></clipPath>
  </defs>
  <rect x="51.2" y="51.2" width="409.6" height="409.6" rx="92.2" fill="url(#tile)" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <g fill="#ffffff" fill-opacity="0.12">
    <rect x="114.7" y="141.3" width="49.2" height="237.6" rx="24.6"/>
    <rect x="192.5" y="141.3" width="49.2" height="237.6" rx="24.6"/>
