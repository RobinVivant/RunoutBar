  <rect x="192.5" y="307.6" width="49.2" height="71.3" fill="url(#purple)" clip-path="url(#bar2)"/>
  <rect x="270.3" y="188.8" width="49.2" height="190.1" fill="url(#teal)" clip-path="url(#bar3)"/>
  <rect x="348.2" y="272" width="49.2" height="106.9" fill="url(#pink)" clip-path="url(#bar4)"/>
